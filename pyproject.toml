[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pymodalhammer"
version = "0.1.0b1"
description = "Impact-hammer modal testing with NI-DAQmx: hit detection, quality checks, H1/H2/Hv averaging, UFF 58 / TDMS export, probe mode and camera triggering (PySide6 GUI)"
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "The pymodalhammer authors" }]
keywords = ["modal testing", "impact hammer", "FRF", "NI-DAQmx", "cDAQ", "UFF", "TDMS", "vibration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "numpy>=1.23",
    "scipy>=1.9",
    "nidaqmx>=0.9",
    "pyuff>=2.4",
    "npTDMS>=1.7",
]

[project.gui-scripts]
pymodalhammer = "pymodalhammer.__main__:main"

[tool.setuptools.packages.find]
include = ["pymodalhammer*"]
